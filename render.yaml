# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: Dashboard → Blueprints → New Blueprint Instance → connect this repo.
#
# Memory (jasper-ai-api): Pro backtests load large price panels + Optuna trials.
#   - 512 MB instances often OOM during online Pro runs; prefer 1 GB+ (Standard).
#   - Dashboard → jasper-ai-api → Settings → Instance Type → Standard (1 GB RAM) or higher.
#   - Blueprint env caps below help on 512 MB; upgrade instance for Pro / 50+ trials.
#   - Env: OPTUNA_N_JOBS=1, SEARCH_RECORDS_MAX=48, RENDER_TRIALS_CAP=30,
#     UNIVERSE_TICKER_CAP=28, WEIGHT_HISTORY_TICKER_CAP=28.
#
# Backtest history (jasper-ai-api): completed jobs persist under JOB_HISTORY_DIR.
#   - Persistent disk is required — ephemeral container FS is wiped on redeploy.
#   - Free tier may not include disks; upgrade to a paid plan and confirm the disk
#     addon in Dashboard → jasper-ai-api → Disks if history disappears after deploy.
#   - Only writes under mountPath survive restarts; keep JOB_HISTORY_DIR inside it.
#
# Email notifications (jasper-ai-api, OPTIONAL): when a user supplies an email
# with a run, a best-effort message is sent when the job completes/fails. The
# feature is fully disabled until SMTP_HOST is set — no email = nothing sent.
# Configure these as SECRET env vars in Dashboard → jasper-ai-api → Environment
# (do NOT commit real secrets to this blueprint):
#   - SMTP_HOST      e.g. smtp.sendgrid.net / smtp.resend.com / smtp.gmail.com
#   - SMTP_PORT      587 (STARTTLS, default) or 465 (implicit SSL, set SMTP_SSL=true)
#   - SMTP_USER      SMTP username (SendGrid: literal "apikey"; Resend: "resend")
#   - SMTP_PASSWORD  SMTP password / API key  (SECRET)
#   - SMTP_FROM      verified From address (falls back to SMTP_USER if unset)
#   - SMTP_STARTTLS  "true" (default) for port 587
#   - SMTP_SSL       "true" only for implicit-TLS providers on port 465
#   - PUBLIC_WEB_URL public URL of jasper-ai-web (e.g. https://jasper-ai-web.onrender.com)
#                    used to build the "view results" deep link (/?job=<id>) in the email
services:
  - type: web
    name: jasper-ai-api
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: OPTUNA_N_JOBS
        value: "1"
      - key: SEARCH_RECORDS_MAX
        value: "48"
      - key: RENDER_TRIALS_CAP
        value: "30"
      - key: UNIVERSE_TICKER_CAP
        value: "28"
      - key: JOB_HISTORY_DIR
        value: /var/data/jobs
      - key: CHAMPION_REGISTRY_PATH
        value: /var/data/champions.db
    disk:
      name: jasper-job-history
      mountPath: /var/data
      sizeGB: 1

  - type: web
    name: jasper-ai-web
    runtime: docker
    dockerfilePath: apps/web/Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: QUANT_API_URL
        fromService:
          type: web
          name: jasper-ai-api
          envVarKey: RENDER_EXTERNAL_URL
